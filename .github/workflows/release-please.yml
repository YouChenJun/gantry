name: Release Please

# Fork-adapted: Conventional Commits on maint/accelerated drive the next
# version / changelog PR. Merging that PR tags the release and dispatches the
# Release workflow against maint/accelerated.

on:
  push:
    branches: [maint/accelerated]
    paths-ignore:
      - appcast.xml
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: maint/accelerated
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Sync the Xcode project version into the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH="$(jq -r '.headBranchName // empty' <<<"$PR_JSON")"
          if [ -z "$BRANCH" ]; then
            echo "::error::release-please reported a PR without a head branch"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch "$BRANCH" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-pr
          cd release-pr
          scripts/sync-version.sh
          if git diff --quiet; then
            echo "Xcode project already matches version.txt"
            exit 0
          fi
          V="$(tr -d '[:space:]' < version.txt)"
          git add Gantry.xcodeproj/project.pbxproj
          git commit -m "build: bump version to $V"
          git push origin "HEAD:$BRANCH"

      - name: Dispatch the signed build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Dispatching Release for $VERSION on maint/accelerated"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref maint/accelerated \
            -f version="$VERSION"

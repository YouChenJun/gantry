name: Release

# Fork-adapted auto-deploy for YouChenJun/gantry (maint/accelerated).
# Builds, optionally Sparkle-signs, publishes a GitHub Release, and updates
# appcast.xml on maint/accelerated.
#
# Trigger:
#   - workflow_dispatch with version (+ optional unsigned=true)
#   - push of a v* tag
#   - Release Please after a release PR merges (dispatches this workflow)
#
# Required for a signed Sparkle release:
#   SPARKLE_PRIVATE_KEY — EdDSA private key from Sparkle `generate_keys -x`
#                         (must match SUPublicEDKey in Info.plist; generate a
#                         fork keypair — do not reuse upstream's private key)
#
# Unsigned fallback: set workflow_dispatch input `unsigned` to true (or omit
# SPARKLE_PRIVATE_KEY and pass unsigned=true). Builds and uploads the zip to a
# GitHub Release; skips appcast signing/commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.24.1 (no leading v)'
        required: true
      unsigned:
        description: 'Skip Sparkle appcast signing; still upload GitHub Release zip'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Prefer the pinned Xcode when the image has it; Select newest Xcode step
  # overrides if the path is absent.
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  RELEASE_BRANCH: maint/accelerated

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
      unsigned: ${{ steps.ver.outputs.unsigned }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maint/accelerated
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            UNSIGNED="${{ github.event.inputs.unsigned }}"
          else
            V="${GITHUB_REF_NAME#v}"
            UNSIGNED="false"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "unsigned=${UNSIGNED:-false}" >> "$GITHUB_OUTPUT"
          echo "Releasing Gantry $V (unsigned=${UNSIGNED:-false})"

      - name: Verify project version matches
        run: |
          PV=$(grep -m1 'MARKETING_VERSION' Gantry.xcodeproj/project.pbxproj \
            | sed -E 's/.*= (.*);/\1/')
          if [ "$PV" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::MARKETING_VERSION ($PV) != release version (${{ steps.ver.outputs.version }}). Bump it on maint/accelerated first."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          CANDIDATE=""
          if [ -d /Applications/Xcode_26.4.1.app ]; then
            CANDIDATE=/Applications/Xcode_26.4.1.app
          else
            CANDIDATE="$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "${CANDIDATE}" ] && [ -d /Applications/Xcode.app ]; then
            CANDIDATE=/Applications/Xcode.app
          fi
          if [ -z "${CANDIDATE}" ]; then
            echo "::error::No Xcode.app found on the runner"
            exit 1
          fi
          echo "Selecting ${CANDIDATE}"
          sudo xcode-select -s "${CANDIDATE}/Contents/Developer"
          echo "DEVELOPER_DIR=${CANDIDATE}/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Write Sparkle signing key
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UNSIGNED: ${{ steps.ver.outputs.unsigned }}
        run: |
          if [ "$UNSIGNED" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Unsigned release requested — skipping Sparkle appcast."
            exit 0
          fi
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set. Re-run with unsigned=true for a GitHub Release zip only, or add a fork Sparkle keypair (see FORK.md)."
            exit 1
          fi
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${RUNNER_TEMP}/sparkle_ed_key"
          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Build, sign and generate appcast
        env:
          RELEASE_XCODEBUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle_ed_key
          SKIP_APPCAST: ${{ steps.sparkle.outputs.mode == 'unsigned' && '1' || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Attach the build to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/Gantry-$V.zip" --clobber
            echo "uploaded Gantry-$V.zip to the existing release v$V"
            exit 0
          fi
          awk -v v="## [$V]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          [ -s "${RUNNER_TEMP}/notes.md" ] || echo "Gantry $V (YouChenJun accelerated fork)" > "${RUNNER_TEMP}/notes.md"
          gh release create "v$V" "dist/Gantry-$V.zip" \
            --title "Gantry $V (accelerated)" \
            --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Commit updated appcast and changelog to maint/accelerated
        if: steps.sparkle.outputs.mode == 'signed'
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No appcast/changelog changes to commit."
            exit 0
          fi
          git commit -m "Release $V: update appcast and changelog"
          for attempt in 1 2 3; do
            git fetch -q origin maint/accelerated
            if git rebase origin/maint/accelerated && git push origin HEAD:maint/accelerated; then
              echo "pushed appcast/changelog to maint/accelerated"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt hit a concurrent update; retrying"; sleep 5
          done
          echo "::error::could not push appcast/changelog to maint/accelerated"; exit 1

      - name: Verify the published appcast
        if: steps.sparkle.outputs.mode == 'signed'
        run: scripts/verify-appcast.py "${{ steps.ver.outputs.version }}"

  # Upstream bumps getgantry/homebrew-tap. This fork does not — leave the job
  # as a no-op notice so a missing HOMEBREW_TAP_DEPLOY_KEY never looks broken.
  tap:
    name: Homebrew tap (skipped on fork)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip upstream tap bump
        run: |
          echo "::notice::Fork releases do not bump getgantry/homebrew-tap. Install from the GitHub Release zip or point your own tap at YouChenJun/gantry."
